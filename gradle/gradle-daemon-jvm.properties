# Daemon JVM criteria (Gradle 9+): the JVM the Gradle daemon itself runs on.
#
# Deliberately hand-written and version-only. `updateDaemonJvm` rewrites this file with ten
# unchecksummed toolchainUrl.<OS>.<ARCH> foojay redirects, pinned to whatever runtime the
# invoking IDE offers (a JetBrains jbrsdk_jcef build, bundled Chromium and all, when Android
# Studio runs it) -- URLs that then execute on every dev machine and CI runner. Edit the one
# line by hand instead.
#
# Cost of going version-only: no auto-provisioning. A machine without a JDK 25 fails with a
# clear error rather than silently downloading one. Arch: jdk25-openjdk. CI: setup-java.
toolchainVersion=25
